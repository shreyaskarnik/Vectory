<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectory — Embedding Playground</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #818cf8;
      --accent-dim: #4f46e5;
      --green: #34d399;
      --red: #f87171;
      --yellow: #fbbf24;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 2rem;
      font-size: 0.875rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.ready { background: var(--green); }
    .status-dot.loading { background: var(--yellow); animation: pulse 1s ease-in-out infinite; }
    .status-dot.error { background: var(--red); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .card p {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      resize: vertical;
      min-height: 60px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea + textarea {
      margin-top: 0.5rem;
    }

    button {
      margin-top: 0.75rem;
      padding: 0.5rem 1.25rem;
      background: var(--accent-dim);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-box {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .result-box.visible { display: block; }

    .sim-score {
      font-size: 2.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .sim-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .sim-bar {
      margin-top: 0.75rem;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .sim-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease, background 0.3s;
    }

    /* Scatter section */
    .scatter-input-row {
      display: flex;
      gap: 0.5rem;
    }

    .scatter-input-row input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.875rem;
      outline: none;
    }

    .scatter-input-row input:focus {
      border-color: var(--accent);
    }

    .scatter-input-row button {
      margin-top: 0;
      white-space: nowrap;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.75rem;
      min-height: 1.5rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      background: var(--accent-dim);
      color: white;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .tag .remove {
      cursor: pointer;
      opacity: 0.6;
    }

    .tag .remove:hover { opacity: 1; }

    canvas {
      width: 100%;
      height: 300px;
      margin-top: 0.75rem;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.75rem;
    }

    .preset-btn {
      margin-top: 0;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      background: var(--border);
    }

    .preset-btn:hover { background: var(--muted); }
  </style>
</head>
<body>
  <h1>Vectory Embedding Playground</h1>
  <p class="subtitle">Powered by EmbeddingGemma-300M running on-device via Transformers.js</p>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Initializing...</span>
  </div>

  <div class="grid">
    <!-- Similarity Calculator -->
    <div class="card">
      <h2>Semantic Similarity</h2>
      <p>Compare two texts — how close are they in meaning?</p>
      <textarea id="textA" placeholder="Text A — e.g. &quot;A cat sleeping on a warm blanket&quot;">A cat sleeping on a warm blanket</textarea>
      <textarea id="textB" placeholder="Text B — e.g. &quot;A kitten napping on a cozy throw&quot;">A kitten napping on a cozy throw</textarea>
      <button id="compareBtn" disabled>Compare</button>

      <div class="result-box" id="simResult">
        <div class="sim-score" id="simScore">—</div>
        <div class="sim-label">cosine similarity</div>
        <div class="sim-bar">
          <div class="sim-bar-fill" id="simBarFill"></div>
        </div>
      </div>
    </div>

    <!-- Scatter Plot -->
    <div class="card">
      <h2>Embedding Scatter</h2>
      <p>Add texts and see them clustered in 2D (PCA projection).</p>
      <div class="scatter-input-row">
        <input type="text" id="scatterInput" placeholder="Type a phrase and press Add..." />
        <button id="addBtn" disabled>Add</button>
      </div>

      <div class="tag-list" id="tagList"></div>

      <canvas id="scatterCanvas"></canvas>

      <div class="presets">
        <button class="preset-btn" data-preset="animals">Animals</button>
        <button class="preset-btn" data-preset="tech">Tech</button>
        <button class="preset-btn" data-preset="emotions">Emotions</button>
        <button class="preset-btn" data-preset="mixed">Mixed</button>
      </div>
    </div>
  </div>

  <script src="demo.js"></script>
</body>
</html>
